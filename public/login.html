<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PARANOIA — God's Login Portal">
  <title>PARANOIA — God's Portal</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
</head>
<body>

  <div class="bg-scene"></div>
  <div class="bg-grid"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="main-container">

    <div class="logo-section fade-in">
      <span class="logo-icon">👁️</span>
      <h1 class="logo-title" data-text="GOD'S DOMAIN">GOD'S DOMAIN</h1>
      <p class="logo-subtitle">Authenticate to proceed</p>
    </div>

    <div class="card fade-in fade-in-delay-1">
      <h2 class="card-title">God Login</h2>
      <p class="card-description">Only God may enter. Prove your identity.</p>

      <form id="loginForm" autocomplete="off">
        <div class="form-group fade-in fade-in-delay-2">
          <label class="form-label" for="loginId">
            <span class="label-icon">🆔</span> God ID
          </label>
          <input type="text" class="form-input" id="loginId" name="login_id"
                 placeholder="Enter your God ID" required>
        </div>

        <div class="form-group fade-in fade-in-delay-3">
          <label class="form-label" for="password">
            <span class="label-icon">🔑</span> Password
          </label>
          <input type="password" class="form-input" id="password" name="password"
                 placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary fade-in fade-in-delay-4" id="loginBtn">
          <span id="btnText">Enter as God</span>
          <div class="spinner" id="btnSpinner" style="display:none"></div>
        </button>
      </form>
    </div>

    <a href="/" class="footer-link fade-in fade-in-delay-4">
      <span>←</span> Back to Player Form
    </a>

  </div>

  <script src="/js/login.js"></script>
</body>
</html>
